name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Add target
        shell: bash
        run: rustup target add --toolchain stable "${{ matrix.target }}"

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Run tests
        shell: bash
        run: cargo test --locked --target "${{ matrix.target }}"

      - name: Run Clippy
        shell: bash
        run: cargo clippy --locked --all-targets --all-features --target "${{ matrix.target }}" -- -D warnings

      - name: Validate catalog
        shell: bash
        run: cargo run --locked --quiet --target "${{ matrix.target }}" -- catalog lint --format json
