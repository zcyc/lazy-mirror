name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: lm
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: lm
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: lm
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: lm.exe
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify tag version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "${tag_version}" = "${package_version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${package_version}" >&2
            exit 1
          }

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Add target
        shell: bash
        run: rustup target add --toolchain stable "${{ matrix.target }}"

      - name: Run tests
        shell: bash
        run: cargo test --locked --target "${{ matrix.target }}"

      - name: Build release binary
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive_base="lm-${GITHUB_REF_NAME}-${{ matrix.target }}"
          stage="dist/${archive_base}"
          mkdir -p "${stage}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${stage}/"
          cp LICENSE.txt README.md "${stage}/"
          tar -czf "dist/${archive_base}.tar.gz" -C dist "${archive_base}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveBase = "lm-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          $stage = "dist/$archiveBase"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $stage
          Copy-Item LICENSE.txt, README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$archiveBase.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/lm-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          format: spdx-json
          output-file: dist/lazy-mirror-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        run: sha256sum dist/lm-* dist/*.spdx.json > dist/SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
